name: zuraffa_tesseract_darwin
description: >-
  Tesseract OCR adapter for iOS and macOS: bridges zuraffa_tesseract to the
  tesseract_ocr Darwin plugin (SwiftyTesseract 4.0.1+ via SPM) over a typed
  method channel.
version: 7.4.2
homepage: https://zuraffa.com

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa: ^7.4.2
  zuraffa_tesseract: ^7.4.2
  zuraffa_tesseract_platform: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/zuraffa_tesseract
issue_tracker: https://github.com/arrrrny/zuraffa_tesseract/issues

topics:
  - ocr
  - tesseract
  - ios
  - macos
  - zuraffa

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TesseractOcrPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TesseractOcrPlugin
        sharedDarwinSource: true
