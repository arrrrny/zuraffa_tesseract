name: zuraffa_tesseract_web
description: >-
  Tesseract OCR adapter for Flutter Web: bridges zuraffa_tesseract to the
  tesseract_ocr web plugin (tesseract.js WebAssembly) over an injected JS
  interop transport.
version: 7.4.2
homepage: https://zuraffa.com

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa: ^7.4.2
  zuraffa_tesseract: ^7.4.2
  zuraffa_tesseract_platform: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/zuraffa_tesseract
issue_tracker: https://github.com/arrrrny/zuraffa_tesseract/issues

topics:
  - ocr
  - tesseract
  - web
  - zuraffa

flutter:
  plugin:
    platforms:
      web:
        pluginClass: TesseractOcrWeb
        fileName: tesseract_ocr_web.dart
